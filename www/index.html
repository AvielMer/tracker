<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121418">
  <meta name="color-scheme" content="dark">
  <title>Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a id="back-btn" class="top-btn" href="#settings" hidden></a>
    <div class="top-titles">
      <div id="eyebrow" class="eyebrow" hidden></div>
      <div id="cal-lines" class="eyebrow cal-lines" hidden></div>
      <h1 id="title">Tracker</h1>
    </div>
    <a id="about-btn" class="top-btn" href="#about" aria-label="About this app"></a>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div id="session-banner" class="banner session" hidden></div>
  <main id="screen"></main>

  <!-- Tabs are filled in by app.js (icons + labels in the chosen language). -->
  <nav class="nav"></nav>

  <div id="toast" class="toast" role="status"></div>
  <div id="sheet" class="sheet" hidden><div class="sheet-body"></div></div>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
